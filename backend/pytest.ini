[pytest]
# The suite mixes two async conventions: @pytest.mark.asyncio (most files) and
# bare `async def test_...` (test_fcc_wiring, test_gateway_admin_contract,
# test_member_projects, test_studio_sovereign_contract,
# test_video_studio_contract). In pytest-asyncio's default strict mode the bare
# form is not run at all and reports "async def functions are not natively
# supported", so those five files failed before any code under test executed.
# `auto` runs both conventions; the explicit marker stays harmless.
asyncio_mode = auto
# The live-server suites import backend modules at collection time; keep the
# repo root off sys.path assumptions as-is (the suites insert it themselves).
