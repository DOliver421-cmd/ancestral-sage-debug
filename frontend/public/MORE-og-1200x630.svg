  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- subtle texture rings on the right -->
  <circle cx="1080" cy="320" r="430" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="2"/>
  <circle cx="1080" cy="320" r="330" fill="none" stroke="#E8A51E" stroke-opacity="0.08" stroke-width="14"/>

