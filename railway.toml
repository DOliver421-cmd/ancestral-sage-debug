# Live deployment entrypoint for the full app (backend + SPA).
# Use this root railway.toml for production releases.
[build]
dockerfilePath = "Dockerfile"

[deploy]
# Use /api/health for Railway's liveness probe. It always returns 200
# with a detailed status object, so Railway does not kill a healthy
# container just because MongoDB is temporarily unreachable.
# The application-level readiness probe remains /api/ready and is
# used by the frontend/UptimeRobot to detect real DB-dependent outages.
healthcheckPath = "/api/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
